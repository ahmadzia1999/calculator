<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .calculator {
    width: 100%;
    max-width: 360px;
    padding: 20px;
  }
  #display {
    width: 100%;
    height: 80px;
    font-size: 40px;
    text-align: right;
    padding: 10px 15px;
    border: none;
    border-radius: 12px;
    background: #ffffff;
    color: #222;
    margin-bottom: 15px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 65px;
    font-size: 26px;
    border: none;
    border-radius: 12px;
    background: #ffffff;
    color: #333;
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
  .gray { background: #d1d5db; }
  .orange { background: #f97316; color: #ffffff; }
</style>
</head>
<body>
  <div class="calculator">
    <input id="display" readonly placeholder="0">
    <div class="buttons">
      <button class="gray" onclick="clearAll()">C</button>
      <button class="gray" onclick="backspace()">&#9003;</button>
      <button class="gray" onclick="percent()">%</button>
      <button class="orange" onclick="append('/')">&#247;</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="orange" onclick="append('*')">&#215;</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="orange" onclick="append('-')">&#8722;</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="orange" onclick="append('+')">+</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('00')">00</button>
      <button onclick="append('.')">.</button>
      <button class="orange" onclick="calculate()">=</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');

  function append(value) {
    display.value += value;
  }

  function clearAll() {
    display.value = '';
  }

  function backspace() {
    display.value = display.value.slice(0, -1);
  }

  function percent() {
    try {
      display.value = run(display.value) / 100;
    } catch (e) {}
  }

  function calculate() {
    try {
      display.value = run(display.value);
    } catch (e) {
      display.value = 'Error';
    }
  }

  function run(expression) {
    return Function('"use strict"; return (' + expression + ')')();
  }
</script>
</body>
</html>
